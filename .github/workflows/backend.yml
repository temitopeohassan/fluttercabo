name: Backend

on:
  # Runs on pushes to any branch, so pull requests from this repo are covered too.
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cabo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (SQLite)
        run: php artisan test

      - name: Import the SQL dump into MySQL 8
        run: mysql -h 127.0.0.1 -uroot -proot cabo < database/cabo.sql

      - name: Check the imported database
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: cabo
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --pretend | grep -q "Nothing to migrate"
          php artisan tinker --execute="echo App\Models\Admin::where('email', 'admin@caboapp.online')->first()?->role;" | grep -q super_admin

      - name: Run tests (MySQL 8)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: cabo
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
